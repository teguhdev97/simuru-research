[project]
name = "simuru-research"
version = "0.5.0"
description = "Local SIMURU API research, team account registry, and synthetic QA dashboard"
readme = "README.md"
authors = [
    { name = "Teguh" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "keyring>=25.6,<26",
    "pandas>=2.2,<4",
    "playwright>=1.52,<2",
    "python-dotenv>=1.1,<2",
    "streamlit>=1.40,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
browser-qa = [
    "selenium>=4.28,<5",
]

[project.scripts]
simuru-research = "simuru_research.cli:main"
simuru-browser-qa = "simuru_research.browser_cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
